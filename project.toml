# =============================================================================
#  project.toml · YOUR PROJECT SETTINGS
#  This is the only file you edit. pipeline.py reads it and does the rest.
#
#  Rules of the format:
#   - Text goes in "double quotes". Lists go in [square brackets].
#   - Lines starting with # are notes for people; the computer ignores them.
#   - SQL that spans several lines goes between triple quotes: """ ... """
#
#  This example: NYC 311 heat and hot water complaints from the last 7 days.
#  To see any API's columns before filling this in, run:  python pipeline.py --preview
# =============================================================================

[project]
name = "subway_ridership"        # a short name: lowercase, no spaces


# -----------------------------------------------------------------------------
# 1. SOURCE: where the data comes from
# -----------------------------------------------------------------------------
[source]
type = "socrata"                # "socrata" for NYC Open Data and most city portals,
                                # "worldbank" for the World Bank (see examples/)

# The API address: on the dataset's page, click Export (or API) and copy the
# "API Endpoint" ending in .json
url = "https://data.ny.gov/resource/5wq4-mkjj.json"

# The columns to keep (use the names that --preview shows you)
columns = ["transit_timestamp", "station_complex_id", "station_complex", "borough", "payment_method", "fare_class_category", "ridership"]

# Optional: only some rows. Leave as "" to take everything.
filter = "transit_mode = 'subway' AND borough = 'Manhattan'"

# Optional: only recent rows. Remove these two lines to take all dates.
date_column = "transit_timestamp"
days_back = 45

max_rows = 20000                # a safety limit on how many rows to fetch


# -----------------------------------------------------------------------------
# 2. CHECKS
# -----------------------------------------------------------------------------
[[checks]]
name = "enough rows arrived"
why  = "a near-empty download means the API or filter went wrong"
sql  = "SELECT CASE WHEN count(*) >= 1000 THEN 0 ELSE 1 END FROM raw"

[[checks]]
name = "ridership is never negative"
why  = "a negative rider count is impossible and would distort crowd levels"
sql  = "SELECT count(*) FROM raw WHERE ridership < 0"

[[checks]]
name = "station and time are never missing"
why  = "a row without a station or hour can't be placed on the map or timeline"
sql  = "SELECT count(*) FROM raw WHERE station_complex_id IS NULL OR transit_timestamp IS NULL"

[[checks]]
name = "no duplicate rows"
why  = "the same station-hour-fare row counted twice would double the ridership"
sql  = """
SELECT count(*) - count(DISTINCT (station_complex_id, transit_timestamp, payment_method, fare_class_category))
FROM raw
"""

[[checks]]
name = "all rows are in Manhattan"
why  = "the filter should only let Manhattan stations through; anything else means the filter broke"
sql  = "SELECT count(*) FROM raw WHERE borough <> 'Manhattan'"

[[checks]]
name = "fresh: newest data is under 45 days old"
why  = "MTA publishes in batches; if it stops updating, we should notice instead of publishing stale data"
sql  = "SELECT CASE WHEN max(transit_timestamp) >= now()::TIMESTAMP - INTERVAL 45 DAY THEN 0 ELSE 1 END FROM raw"


# -----------------------------------------------------------------------------
# 3. TABLES
# -----------------------------------------------------------------------------

# (a) The clean table: one row per station x hour (fare types added together)
[[tables]]
name = "subway_ridership"
sql  = """
SELECT station_complex_id, station_complex, borough,
       transit_timestamp,
       transit_timestamp::DATE        AS ride_day,
       hour(transit_timestamp)        AS ride_hour,
       sum(ridership)                 AS riders
FROM raw
GROUP BY station_complex_id, station_complex, borough, transit_timestamp
"""

# (b) A trend: average riders by station and hour of day
[[tables]]
name = "ridership_by_station_hour"
sql  = """
SELECT station_complex, ride_hour, round(avg(riders), 1) AS avg_riders
FROM subway_ridership
GROUP BY station_complex, ride_hour
"""

# (c) Key metrics: one row per station
[[tables]]
name = "station_summary"
sql  = """
SELECT station_complex,
       sum(riders)                                        AS total_riders,
       round(sum(riders) / count(DISTINCT ride_day), 0)   AS avg_per_day,
       arg_max(ride_hour, riders)                         AS busiest_hour
FROM subway_ridership
GROUP BY station_complex
ORDER BY total_riders DESC
"""

# (d) A ranking: the 20 busiest stations
[[tables]]
name = "top_stations"
sql  = """
SELECT station_complex, total_riders, avg_per_day
FROM station_summary
ORDER BY total_riders DESC
LIMIT 20
"""


# -----------------------------------------------------------------------------
# 4. REPORT
# -----------------------------------------------------------------------------
[[report]]
question = "Which five Manhattan stations are busiest?"
sql = "SELECT * FROM top_stations LIMIT 5"

[[report]]
question = "What hour of the day is busiest across Manhattan?"
sql = """
SELECT ride_hour, round(sum(avg_riders), 0) AS avg_riders
FROM ridership_by_station_hour
GROUP BY ride_hour
ORDER BY avg_riders DESC
LIMIT 5
"""

